name: Lint

on:
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  lint:
    name: Run golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run lint
        run: make lint
