#
# Dev overrides for make tilt-up. Rendered on top of chart/metaldhcp/values.yaml.

image:
  repository: localhost:5001/metaldhcp
  tag: latest

server:
  logLevel: debug
  serverID: "192.168.100.1"
  leaseTime: 1h
  netmask: "255.255.255.0"

securityContext:
  runAsUser: 0
  capabilities:
    add:
      - NET_BIND_SERVICE
      - NET_RAW

oob:
  namespace: metaldhcp-system
  subnets:
    - cidr: 192.168.100.0/24
      gateway: 192.168.100.1
      rangeStart: 192.168.100.10
      rangeEnd: 192.168.100.100
      leaseTime: 1h
      # bootURL: https://boot-operator.example.com/boot
    - cidr: 10.0.2.0/24
      gateway: 10.0.2.1
      rangeStart: 10.0.2.10
      rangeEnd: 10.0.2.100
      leaseTime: 1h
      # bootURL: https://boot-operator-remote.example.com/boot
  staticLeases:
    - mac: "02:aa:bb:cc:dd:03"
      ip: 192.168.100.200
      hostname: node-direct-static

debug:
  enabled: true
  serverIP: 192.168.100.1
  serverCIDR: /24
