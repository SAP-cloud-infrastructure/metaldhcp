#
# Dev overrides for make tilt-up. Rendered on top of chart/metaldhcp/values.yaml.

image:
  repository: localhost:5001/metaldhcp
  tag: latest

networkInit:
  enabled: false

externalIP: "192.168.100.1"

server:
  logLevel: debug
  leaseTime: 1h
  netmask: "255.255.255.0"

securityContext:
  runAsUser: 0
  capabilities:
    add:
      - NET_BIND_SERVICE
      - NET_RAW

oob:
  subnets:
    - cidr: 192.168.100.0/24
      gateway: 192.168.100.1
      rangeStart: 192.168.100.10
      rangeEnd: 192.168.100.100
      leaseTime: 1h
      bootURL: https://boot-operator.example.com/boot
      mode: allow
      macList:
        - "18:66:da:00:11:01"  # Dell
        - "10:c5:95:00:11:03"  # Lenovo
      clientIdList:
        - "cc0304ddee"   # CID_FILTER_CLIENT — admitted by clientIdList, no static lease
      staticLeases:
        - mac: "10:c5:95:00:11:03"
          ip: 192.168.100.200
          hostname: node-direct-static
        - clientId: "ff0102aabb"
          ip: 192.168.100.201
          hostname: node-cid-static
    - cidr: 10.0.2.0/24
      gateway: 10.0.2.1
      rangeStart: 10.0.2.10
      rangeEnd: 10.0.2.100
      leaseTime: 1h
      mode: allow
      macList:
        - "04:09:73:00:11:02"  # HPE

  dnsServers:
    - 8.8.8.8
    - 8.8.4.4
  domain: dev.metaldhcp.local
  ntpServers:
    - 216.239.35.0
  tftpFiles:
    - vendorClass: "PXEClient:Arch:00007"  # x86-64 UEFI → snponly.efi (the baked-in binary)
      filename: snponly.efi
    - vendorClass: "PXEClient:Arch:00014"  # ARM64 UEFI → distinct name (selection-only, no binary)
      filename: ipxe-arm64.efi
    - filename: fallback.efi                # fallback for all other architectures (selection-only)

debug:
  enabled: true
  serverIP: 192.168.100.1
  serverCIDR: /24

tftp:
  enabled: true
  nbpFilename: snponly.efi
