apiVersion: v1
kind: Service
metadata:
  name: {{ include "metaldhcp.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaldhcp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "metaldhcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: dhcp
      port: 67
      protocol: UDP
      targetPort: 67
    {{- if .Values.webhook.enabled }}
    - name: webhook
      port: {{ .Values.webhook.port }}
      protocol: TCP
      targetPort: {{ .Values.webhook.port }}
    {{- end }}
    {{- if .Values.tftp.enabled }}
    - name: tftp
      port: 69
      protocol: UDP
      targetPort: 69
    {{- end }}
  type: LoadBalancer
  loadBalancerIP: {{ .Values.externalIP }}
  externalTrafficPolicy: Local
