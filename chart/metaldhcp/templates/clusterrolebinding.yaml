apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "metaldhcp.fullname" . }}
  labels:
    {{- include "metaldhcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "metaldhcp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "metaldhcp.fullname" . }}
    namespace: {{ .Values.namespace }}
