apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metaldhcp.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaldhcp.labels" . | nindent 4 }}
data:
  config.yaml: |
    server4:
      listen:
        - {{ .Values.server.listenAddr | quote }}
      plugins:
        - lease_time: {{ .Values.server.leaseTime }}
        {{- if .Values.externalIP }}
        - server_id: {{ .Values.externalIP }}
        {{- end }}
        - netmask:{{ if .Values.server.netmask }} {{ .Values.server.netmask }}{{ end }}
        - oob: /etc/metaldhcp/oob.yaml
        {{- if .Values.tftp.enabled }}
        - nbp: tftp://{{ required "externalIP is required when tftp.enabled" .Values.externalIP }}/{{ .Values.tftp.nbpFilename }}
        {{- end }}
  oob.yaml: |
    {{- with .Values.oob.subnetLabels }}
    subnetLabels:
      {{- range . }}
      - key: {{ .key }}
        value: {{ .value | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.oob.subnets }}
    subnets:
      {{- range . }}
      - cidr: {{ .cidr }}
        {{- if .gateway }}
        gateway: {{ .gateway }}
        {{- end }}
        {{- if .rangeStart }}
        rangeStart: {{ .rangeStart }}
        {{- end }}
        {{- if .rangeEnd }}
        rangeEnd: {{ .rangeEnd }}
        {{- end }}
        {{- if .leaseTime }}
        leaseTime: {{ .leaseTime }}
        {{- end }}
        {{- if .bootURL }}
        bootURL: {{ .bootURL }}
        {{- end }}
        {{- with .dnsServers }}
        dnsServers:
          {{- range . }}
          - {{ . }}
          {{- end }}
        {{- end }}
        {{- if .domain }}
        domain: {{ .domain }}
        {{- end }}
        {{- with .staticLeases }}
        staticLeases:
          {{- range . }}
          - mac: {{ .mac | quote }}
            ip: {{ .ip }}
            {{- if .hostname }}
            hostname: {{ .hostname }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- with .allowMacs }}
        allowMacs:
          {{- range . }}
          - {{ . }}
          {{- end }}
        {{- end }}
        {{- if .allowAllMacs }}
        allowAllMacs: true
        {{- end }}
        {{- if .responseDelay }}
        responseDelay: {{ .responseDelay }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with .Values.oob.dnsServers }}
    dnsServers:
      {{- range . }}
      - {{ . }}
      {{- end }}
    {{- end }}
    {{- with .Values.oob.domain }}
    domain: {{ . }}
    {{- end }}
    {{- with .Values.oob.ntpServers }}
    ntpServers:
      {{- range . }}
      - {{ . }}
      {{- end }}
    {{- end }}
