apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metaldhcp.fullname" . }}
  namespace: {{ include "metaldhcp.namespace" . }}
  labels:
    {{- include "metaldhcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "metaldhcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "metaldhcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "metaldhcp.fullname" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/exclude-from-external-load-balancers
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 10
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "metaldhcp.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      initContainers:
        {{- if .Values.networkInit.enabled }}
        - name: network-init
          image: "{{ .Values.networkInit.image.repository }}:{{ .Values.networkInit.image.tag | default .Chart.AppVersion }}"
          command: ["/bin/sh", "/scripts/dhcp-init.sh"]
          env:
            - name: EXTERNALIP
              value: {{ .Values.externalIP | quote }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: shared
              mountPath: /shared
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
        {{- end }}
        {{- if and .Values.tftp.enabled .Values.tftp.ipxeURL }}
        - name: fetch-ipxe
          image: busybox:1.37
          command:
            - wget
            - -O
            - /ipxe/{{ .Values.tftp.nbpFilename }}
            - {{ .Values.tftp.ipxeURL | quote }}
          volumeMounts:
            - name: ipxe-override
              mountPath: /ipxe
        {{- end }}
      containers:
        - name: metaldhcp
          image: {{ include "metaldhcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/etc/metaldhcp/config.yaml"
            - "-loglevel"
            - {{ .Values.server.logLevel | quote }}
            - "-health-addr"
            - {{ .Values.server.healthAddr | quote }}
            {{- if .Values.webhook.enabled }}
            - "-webhook-enabled"
            - "-webhook-addr"
            - ":{{ .Values.webhook.port }}"
            - "-webhook-cert"
            - "/etc/metaldhcp/webhook/tls.crt"
            - "-webhook-key"
            - "/etc/metaldhcp/webhook/tls.key"
            {{- end }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if .Values.remoteAPIServer }}
            - name: KUBECONFIG
              value: /var/run/remote-kubeconfig/kubeconfig
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/metaldhcp
              readOnly: true
            {{- if .Values.remoteAPIServer }}
            - name: remote-kubeconfig
              mountPath: /var/run/remote-kubeconfig
            - name: remote-serviceaccount
              mountPath: /var/run/secrets/kubernetes.io/remote-serviceaccount
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook-cert
              mountPath: /etc/metaldhcp/webhook
              readOnly: true
            {{- end }}
        {{- if .Values.debug.enabled }}
        - name: debug
          image: {{ .Values.debug.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ip link add veth0-server type veth peer name veth0
              ip addr add {{ .Values.debug.serverIP }}{{ .Values.debug.serverCIDR }} dev veth0-server
              ip link set veth0-server up
              ip link set veth0 up
              echo "veth pair ready"
              sleep infinity
          securityContext:
            capabilities:
              add: ["NET_RAW", "NET_ADMIN"]
        {{- end }}
        {{- if .Values.tftp.enabled }}
        - name: tftpd
          image: {{ include "metaldhcp.image" . }}
          command: ["/tftpd"]
          args:
            - --root=/ipxe
          ports:
            - name: tftp
              containerPort: 69
              protocol: UDP
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
          {{- if .Values.tftp.ipxeURL }}
          volumeMounts:
            - name: ipxe-override
              mountPath: /ipxe
          {{- end }}
        {{- end }}
        {{- if .Values.networkInit.enabled }}
        - name: network-lifecycle
          image: "{{ .Values.networkInit.image.repository }}:{{ .Values.networkInit.image.tag | default .Chart.AppVersion }}"
          command: ["sleep", "infinity"]
          env:
            - name: EXTERNALIP
              value: {{ .Values.externalIP | quote }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
              drop: ["ALL"]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "/scripts/dhcp-stop.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: shared
              mountPath: /shared
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "metaldhcp.fullname" . }}-config
        - name: scripts
          configMap:
            name: {{ include "metaldhcp.fullname" . }}-scripts
            defaultMode: 0755
        - name: shared
          emptyDir: {}
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        {{- if .Values.webhook.enabled }}
        - name: webhook-cert
          secret:
            secretName: {{ required "webhook.certSecretName is required when webhook.enabled" .Values.webhook.certSecretName }}
        {{- end }}
        {{- if and .Values.tftp.enabled .Values.tftp.ipxeURL }}
        - name: ipxe-override
          emptyDir: {}
        {{- end }}
        {{- if .Values.remoteAPIServer }}
        - name: remote-kubeconfig
          configMap:
            name: {{ .Release.Name }}-remote-kubeconfig
        - name: remote-serviceaccount
          secret:
            secretName: {{ .Release.Name }}-remote-kubeconfig
            items:
              - key: token
                path: token
              - key: bundle.crt
                path: ca.crt
        {{- end }}
      terminationGracePeriodSeconds: 30
