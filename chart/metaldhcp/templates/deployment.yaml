apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metaldhcp.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaldhcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "metaldhcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "metaldhcp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "metaldhcp.fullname" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if and .Values.tftp.enabled .Values.tftp.ipxeURL }}
      initContainers:
        - name: fetch-ipxe
          image: busybox:1.37
          command:
            - wget
            - -O
            - /ipxe/{{ .Values.tftp.nbpFilename }}
            - {{ .Values.tftp.ipxeURL | quote }}
          volumeMounts:
            - name: ipxe-override
              mountPath: /ipxe
      {{- end }}
      containers:
        - name: metaldhcp
          image: {{ include "metaldhcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config"
            - "/etc/metaldhcp/config.yaml"
            - "-loglevel"
            - {{ .Values.server.logLevel | quote }}
            - "-health-addr"
            - {{ .Values.server.healthAddr | quote }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/metaldhcp
              readOnly: true
        {{- if .Values.debug.enabled }}
        - name: debug
          image: {{ .Values.debug.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ip link add veth0-server type veth peer name veth0
              ip addr add {{ .Values.debug.serverIP }}{{ .Values.debug.serverCIDR }} dev veth0-server
              ip link set veth0-server up
              ip link set veth0 up
              echo "veth pair ready"
              sleep infinity
          securityContext:
            capabilities:
              add: ["NET_RAW", "NET_ADMIN"]
        {{- end }}
        {{- if .Values.tftp.enabled }}
        - name: tftpd
          image: {{ include "metaldhcp.image" . }}
          command: ["/tftpd"]
          args:
            - --root=/ipxe
          ports:
            - name: tftp
              containerPort: 69
              protocol: UDP
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          {{- if .Values.tftp.ipxeURL }}
          volumeMounts:
            - name: ipxe-override
              mountPath: /ipxe
          {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "metaldhcp.fullname" . }}-config
        {{- if and .Values.tftp.enabled .Values.tftp.ipxeURL }}
        - name: ipxe-override
          emptyDir: {}
        {{- end }}
