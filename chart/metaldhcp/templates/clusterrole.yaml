{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "metaldhcp.fullname" . }}
  labels:
    {{- include "metaldhcp.labels" . | nindent 4 }}
rules:
{{ (.Files.Get "rbac/role.yaml" | fromYaml).rules | toYaml | nindent 0 -}}
{{- end }}
