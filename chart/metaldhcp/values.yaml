image:
  repository: ghcr.io/sap-cloud-infrastructure/metaldhcp
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

networkInit:
  enabled: true
  image:
    repository: ghcr.io/sap-cloud-infrastructure/metaldhcp-network-init
    tag: ""  # defaults to Chart.appVersion

# Namespace where metaldhcp runs and where DHCPLease objects are written.
namespace: metaldhcp-system

# createNamespace controls whether the Namespace resource is included in the chart.
# Set to false when the namespace is managed externally.
createNamespace: true

# service controls the LoadBalancer Service that exposes the DHCP/TFTP ports.
# Disable when networkInit.enabled manages the VIP directly via ip addr add — in that
# case the pod binds to externalIP:67 itself and kube-proxy DNAT rules would conflict.
service:
  enabled: true

# externalIP is the LoadBalancer VIP assigned to the Service. It is used as:
#   - DHCP option 54 (Server Identifier): clients unicast RENEW/REBIND to this address.
#     If set to the pod IP instead, renewals bypass the LoadBalancer and break on pod restart.
#   - siaddr (BOOTP header): next-server field, used by some PXE clients for TFTP.
#   - TFTP server name (option 66) when tftp.enabled.
# DHCP relay agents must also be configured to forward to this address.
externalIP: ""

server:
  listenAddr: "0.0.0.0:67"
  leaseTime: 3600s
  netmask: "255.255.255.0"
  logLevel: info
  healthAddr: ":8080"

# oob plugin configuration — maps directly to the oob.yaml config file.
oob:
  # namespace where DHCPLease CRs are written and OOBSubnet CRs are read from.
  # Defaults to the release namespace when empty.
  namespace: ""
  # subnetLabels selects OOBSubnet CRs as pools. Ignored when subnets is non-empty.
  subnetLabels: []
  # - key: dhcp
  #   value: "true"

  # subnets defines pools inline. When non-empty, takes precedence over OOBSubnet CRs.
  subnets: []
  # - cidr: 192.168.10.0/24
  #   gateway: 192.168.10.1
  #   rangeStart: 192.168.10.100
  #   rangeEnd: 192.168.10.200
  #   leaseTime: 24h
  #   bootURL: https://boot-operator.example.com/boot
  #   # mode: allowAll (default, serve everyone) | allow (serve only macList) |
  #   #       deny (serve all except macList). macList is ignored for allowAll.
  #   mode: allow
  #   macList:
  #   - "18:66:da:00:11:01"
  #   # dnsServers and domain override the global values for clients in this subnet.
  #   dnsServers:
  #   - 1.1.1.1
  #   domain: subnet.example.com
  #   staticLeases:
  #   - mac: "aa:bb:cc:dd:ee:ff"
  #     ip: 192.168.10.200
  #     hostname: bmc-static-01

  # publishStaticLeases: when true, a DHCPLease CR is created for each static lease entry
  # at startup without waiting for a DHCP request. Useful when BMCs are statically
  # configured and will never send DHCP requests but still need to be onboarded via MOO.
  # publishStaticLeases: false

  # dnsServers is sent as DHCP option 6. Required for clients to resolve boot-operator.
  dnsServers: []
  # - 147.204.9.200
  # - 147.204.9.201

  # domain is sent as DHCP option 15 (DNS search domain).
  domain: ""
  # domain: cc.qa-de-1.cloud.sap

  # ntpServers is sent as DHCP option 42.
  ntpServers: []
  # - 132.163.96.1

  # tftpFiles maps client vendor class (DHCP option 60) prefixes to bootfile names
  # (option 67). When non-empty, the oob plugin selects option 67 per request by prefix
  # match and sets option 66 to externalIP, stopping the plugin chain so nbp does not
  # override it. An entry without vendorClass is the fallback for unmatched clients.
  # When empty, the nbp plugin handles options 66/67 as before (no behaviour change).
  # The binaries must be delivered to the tftpd container (see tftp.ipxeFiles).
  tftpFiles: []
  # - vendorClass: "PXEClient:Arch:00007"  # x86-64 UEFI
  #   filename: ipxe-x64.efi
  # - vendorClass: "PXEClient:Arch:00014"  # ARM64 UEFI
  #   filename: ipxe-arm64.efi
  # - filename: snponly.efi                # fallback (no vendorClass)

  # reclaimGrace is the grace period past a dynamic lease's expiry before its address may be
  # reclaimed for another client. Empty uses the server default (1h).
  reclaimGrace: ""
  # reclaimGrace: 1h

securityContext:
  capabilities:
    add:
      - NET_BIND_SERVICE
      - NET_RAW

# podLabels are added to the pod template labels. Useful for network policy selectors.
podLabels: {}

# remoteAPIServer enables cross-cluster operation: when set to a <host>:<port>, the server
# mounts a kubeconfig that points to that API server and sets KUBECONFIG accordingly.
# A ConfigMap named <release-name>-remote-kubeconfig is created with the kubeconfig.
# The token/CA must be injected externally (e.g. via Gardener token-requestor).
remoteAPIServer: ""

rbac:
  # create controls whether ClusterRole and ClusterRoleBinding are created.
  # Set to false when RBAC is managed externally (e.g. via Gardener ManagedResource).
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# debug adds a netshoot sidecar that creates a veth pair for local DHCP testing.
# Enable in dev environments only; not suitable for production.
debug:
  enabled: false
  image: nicolaka/netshoot
  serverIP: 192.168.100.1
  serverCIDR: /24

# tftp enables a TFTP sidecar that serves the iPXE binary to PXE-booting clients.
# The sidecar runs in the same Pod (shared network namespace) so its IP matches the
# DHCP server IP. snponly.efi (UEFI) is baked into the image at /ipxe/snponly.efi
# and served without any additional configuration.
# UDP/69 is added to the Service when enabled.
tftp:
  enabled: false  # nbpFilename is the filename served over TFTP and advertised in DHCP option 67.
  nbpFilename: "snponly.efi"
  # ipxeFiles overrides the baked-in binary: when set, an init container downloads each
  # file from its url into the shared /ipxe volume at Pod startup and tftpd serves them.
  # Pair with oob.tftpFiles so DHCP advertises the matching filename per architecture.
  ipxeFiles: []
  # - url: https://boot-operator.runtime.qa-de-1/ipxe-x64.efi
  #   filename: ipxe-x64.efi
  # - url: https://boot-operator.runtime.qa-de-1/ipxe-arm64.efi
  #   filename: ipxe-arm64.efi

# webhook configures the OOBSubnet validating admission webhook.
webhook:
  enabled: false
  # port is the HTTPS port the webhook server listens on inside the pod.
  port: 9443
  # certSecretName is the name of the Secret containing tls.crt and tls.key.
  certSecretName: ""
  # certManager enables automatic cert provisioning via cert-manager.
  certManager:
    enabled: false
