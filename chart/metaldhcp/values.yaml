image:
  repository: ghcr.io/sap-cloud-infrastructure/metaldhcp
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

# Namespace where metaldhcp runs and where DHCPLease objects are written.
namespace: metaldhcp-system

# createNamespace controls whether the Namespace resource is included in the chart.
# Set to false when the namespace is managed externally.
createNamespace: true

# externalIP is the LoadBalancer VIP assigned to the Service. It is used as:
#   - DHCP option 54 (Server Identifier): clients unicast RENEW/REBIND to this address.
#     If set to the pod IP instead, renewals bypass the LoadBalancer and break on pod restart.
#   - siaddr (BOOTP header): next-server field, used by some PXE clients for TFTP.
#   - TFTP server name (option 66) when tftp.enabled.
# DHCP relay agents must also be configured to forward to this address.
externalIP: ""

server:
  listenAddr: "0.0.0.0:67"
  leaseTime: 3600s
  netmask: "255.255.255.0"
  logLevel: info
  healthAddr: ":8080"

# oob plugin configuration — maps directly to the oob.yaml config file.
oob:
  # subnetLabels selects OOBSubnet CRs as pools. Ignored when subnets is non-empty.
  subnetLabels: []
  # - key: dhcp
  #   value: "true"

  # subnets defines pools inline. When non-empty, takes precedence over OOBSubnet CRs.
  subnets: []
  # - cidr: 192.168.10.0/24
  #   gateway: 192.168.10.1
  #   rangeStart: 192.168.10.100
  #   rangeEnd: 192.168.10.200
  #   leaseTime: 24h
  #   bootURL: https://boot-operator.example.com/boot
  #   # mode: allowAll (default, serve everyone) | allow (serve only macList) |
  #   #       deny (serve all except macList). macList is ignored for allowAll.
  #   mode: allow
  #   macList:
  #   - "18:66:da:00:11:01"
  #   # dnsServers and domain override the global values for clients in this subnet.
  #   dnsServers:
  #   - 1.1.1.1
  #   domain: subnet.example.com
  #   staticLeases:
  #   - mac: "aa:bb:cc:dd:ee:ff"
  #     ip: 192.168.10.200
  #     hostname: bmc-static-01

  # dnsServers is sent as DHCP option 6. Required for clients to resolve boot-operator.
  dnsServers: []
  # - 147.204.9.200
  # - 147.204.9.201

  # domain is sent as DHCP option 15 (DNS search domain).
  domain: ""
  # domain: cc.qa-de-1.cloud.sap

  # ntpServers is sent as DHCP option 42.
  ntpServers: []
  # - 132.163.96.1

  # reclaimGrace is the grace period past a dynamic lease's expiry before its address may be
  # reclaimed for another client. Empty uses the server default (1h).
  reclaimGrace: ""
  # reclaimGrace: 1h

securityContext:
  capabilities:
    add:
      - NET_BIND_SERVICE
      - NET_RAW

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# debug adds a netshoot sidecar that creates a veth pair for local DHCP testing.
# Enable in dev environments only; not suitable for production.
debug:
  enabled: false
  image: nicolaka/netshoot
  serverIP: 192.168.100.1
  serverCIDR: /24

# tftp enables a TFTP sidecar that serves the iPXE binary to PXE-booting clients.
# The sidecar runs in the same Pod (shared network namespace) so its IP matches the
# DHCP server IP. snponly.efi (UEFI) is baked into the image at /ipxe/snponly.efi
# and served without any additional configuration.
# UDP/69 is added to the Service when enabled.
tftp:
  enabled: false  # nbpFilename is the filename served over TFTP and advertised in DHCP option 67.
  nbpFilename: "snponly.efi"
  # ipxeURL overrides the baked-in binary: when set, an init container downloads the
  # file from this URL at Pod startup and serves it instead.
  # Example: https://boot-operator.runtime.qa-de-1/ipxe.efi
  ipxeURL: ""

# webhook configures the OOBSubnet validating admission webhook.
webhook:
  enabled: false
  # port is the HTTPS port the webhook server listens on inside the pod.
  port: 9443
  # certSecretName is the name of the Secret containing tls.crt and tls.key.
  certSecretName: ""
  # certManager enables automatic cert provisioning via cert-manager.
  certManager:
    enabled: false
